# Pipeline CI/CD de la tienda: Build -> SmokeTests -> LoadTest -> E2E -> E2E_Sauce -> Deploy
#
# QUALITY GATES (si uno falla, las etapas siguientes NO se ejecutan):
#   GATE 1 (SmokeTests): node tests/smoke-api.js sale con exit 1 si la app no "enciende".
#   GATE 2 (LoadTest)  : node tests/carga-simple.js sale con exit 1 si p95 >= SLA o error >= 1%.
#   GATE 3 (E2E)       : pytest sale con codigo distinto de 0 si algun escenario BDD falla.
#   GATE 4 (E2E_Sauce) : mismas pruebas en navegadores reales de Sauce Labs. Solo corre si existe la
#                        variable SAUCE_USERNAME; si no existe, la etapa se omite (Skipped).
#   El stage Deploy se bloquea si falla cualquiera de los gates anteriores.
#
# Para forzar el ROJO de carga: Run pipeline -> cambiar el parametro slaP95Ms a 0.1.
#
# E2E publica el JUnit en la pestana Tests y, si existe el secreto AZURE_DEVOPS_PAT,
# actualiza los Test Points del Test Plan (Plan 1, Suite 2) con Passed/Failed.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-24.04'

parameters:
  - name: slaP95Ms
    displayName: 'SLA de carga - p95 maximo en ms (usa 0.1 para forzar ROJO)'
    type: string
    default: '800'

variables:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.12'
  APP_DIR: 'app-tienda'
  TEST_DIR: 'pipeline'
  E2E_DIR: 'e2e'
  TEST_PLAN_ID: '1'
  TEST_SUITE_ID: '2'

stages:
  # ------------------------------------------------------------
  - stage: Build
    displayName: 'Build - instalar y generar datos'
    jobs:
      - job: build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
          - script: npm install
            displayName: 'npm install (postinstall genera db.json con Faker)'
            workingDirectory: '$(APP_DIR)'
          - script: |
              node -e "const d=require('./datos/db.json'); console.log('productos:', d.productos.length); if (d.productos.length < 20) process.exit(1)"
            displayName: 'Verificar datos generados (minimo 20 productos)'
            workingDirectory: '$(APP_DIR)'

  # ------------------------------------------------------------
  - stage: SmokeTests
    displayName: 'Smoke - la app encendio (GATE 1)'
    dependsOn: Build
    jobs:
      - job: smoke
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
          # App y pruebas en UN solo paso: los procesos en background mueren al terminar el paso.
          - script: |
              set -e
              cd "$(Build.SourcesDirectory)/$(APP_DIR)"
              npm install
              nohup node servidor/server.js </dev/null > "$(Build.SourcesDirectory)/app.log" 2>&1 &
              LISTA=0
              for i in $(seq 1 20); do
                if curl -sf http://localhost:3000/api/health > /dev/null; then LISTA=1; break; fi
                sleep 1
              done
              if [ "$LISTA" != "1" ]; then echo "La app no arranco"; cat "$(Build.SourcesDirectory)/app.log"; exit 1; fi
              cd "$(Build.SourcesDirectory)/$(TEST_DIR)"
              node tests/smoke-api.js
            displayName: 'Arrancar app + smoke test (GATE 1)'
            env:
              BASE_URL: 'http://localhost:3000'

  # ------------------------------------------------------------
  - stage: LoadTest
    displayName: 'Carga - SLA p95 y error (GATE 2)'
    dependsOn: SmokeTests
    jobs:
      - job: carga
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
          - script: |
              set -e
              cd "$(Build.SourcesDirectory)/$(APP_DIR)"
              npm install
              nohup node servidor/server.js </dev/null > "$(Build.SourcesDirectory)/app.log" 2>&1 &
              LISTA=0
              for i in $(seq 1 20); do
                if curl -sf http://localhost:3000/api/health > /dev/null; then LISTA=1; break; fi
                sleep 1
              done
              if [ "$LISTA" != "1" ]; then echo "La app no arranco"; cat "$(Build.SourcesDirectory)/app.log"; exit 1; fi
              cd "$(Build.SourcesDirectory)/$(TEST_DIR)"
              node tests/carga-simple.js
            displayName: 'Arrancar app + prueba de carga (GATE 2, exit 1 si no cumple SLA)'
            env:
              BASE_URL: 'http://localhost:3000'
              CONCURRENCIA: '15'
              DURACION_S: '8'
              SLA_P95_MS: '${{ parameters.slaP95Ms }}'
              SLA_ERROR_PCT: '1'

  # ------------------------------------------------------------
  - stage: E2E
    displayName: 'E2E - Playwright + Screenplay + pytest-bdd (GATE 3)'
    dependsOn: LoadTest
    jobs:
      - job: e2e
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(PYTHON_VERSION)'
          # App viva durante todo el paso: se arranca y se prueba en el mismo script.
          - script: |
              set -e
              cd "$(Build.SourcesDirectory)/$(APP_DIR)"
              npm install
              nohup node servidor/server.js </dev/null > "$(Build.SourcesDirectory)/app.log" 2>&1 &
              LISTA=0
              for i in $(seq 1 20); do
                if curl -sf http://localhost:3000/api/health > /dev/null; then LISTA=1; break; fi
                sleep 1
              done
              if [ "$LISTA" != "1" ]; then echo "La app no arranco"; cat "$(Build.SourcesDirectory)/app.log"; exit 1; fi
              cd "$(Build.SourcesDirectory)/$(E2E_DIR)"
              pip install -r requirements.txt
              python -m playwright install --with-deps chromium
              pytest -o junit_family=xunit1 --junitxml=resultados/junit.xml
            displayName: 'Arrancar app + escenarios BDD (GATE 3)'
            env:
              BASE_URL: 'http://localhost:3000'

          - task: PublishTestResults@2
            condition: always()
            displayName: 'Publicar resultados JUnit (pestana Tests)'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(E2E_DIR)/resultados/junit.xml'
              testRunTitle: 'E2E Tienda - pytest-bdd'

          # Actualiza los Test Points del Test Plan. Solo corre si existe el secreto AZURE_DEVOPS_PAT.
          - script: python tools/publicar_test_plan.py
            condition: and(always(), ne(variables['AZURE_DEVOPS_PAT'], ''))
            displayName: 'Vincular resultados al Test Plan de Azure'
            workingDirectory: '$(E2E_DIR)'
            env:
              AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
              TEST_PLAN_ID: $(TEST_PLAN_ID)
              TEST_SUITE_ID: $(TEST_SUITE_ID)
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: 'Adjuntar resultados como artefacto'
            inputs:
              targetPath: '$(E2E_DIR)/resultados'
              artifact: 'resultados-e2e'

  # ------------------------------------------------------------
  # FASE 4 - Ejecucion en la nube (Sauce Labs).
  # Las MISMAS pruebas corren en un Chrome real de Sauce cambiando solo configuracion:
  #   SAUCE=1, SAUCE_USERNAME, SAUCE_ACCESS_KEY (secreto), region, navegador y plataforma.
  # La app corre en el agente (localhost:3000) y Sauce la alcanza por un tunel Sauce Connect.
  # App, tunel y pruebas van en UN solo paso porque los procesos en background mueren al terminar el paso.
  # Variables a crear en el pipeline: SAUCE_USERNAME (normal) y SAUCE_ACCESS_KEY (secreta).
  - stage: E2E_Sauce
    displayName: 'E2E en Sauce Labs (navegadores reales, via tunel)'
    dependsOn: E2E
    condition: and(succeeded(), ne(variables['SAUCE_USERNAME'], ''))
    jobs:
      - job: e2e_sauce
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(PYTHON_VERSION)'
          - script: |
              set -e
              cd "$(Build.SourcesDirectory)/$(APP_DIR)"
              npm install
              nohup node servidor/server.js </dev/null > "$(Build.SourcesDirectory)/app.log" 2>&1 &
              LISTA=0
              for i in $(seq 1 20); do
                if curl -sf http://localhost:3000/api/health > /dev/null; then LISTA=1; break; fi
                sleep 1
              done
              if [ "$LISTA" != "1" ]; then echo "La app no arranco"; cat "$(Build.SourcesDirectory)/app.log"; exit 1; fi

              cd "$(Build.SourcesDirectory)"
              curl -sL -o sc.tar.gz https://saucelabs.com/downloads/sauce-connect/5.2.2/sauce-connect-5.2.2_linux.x86_64.tar.gz
              tar -xzf sc.tar.gz
              SC_BIN=$(find . -name 'sauce-connect' -type f | head -n1)
              nohup "$SC_BIN" run --username "$SAUCE_USERNAME" --access-key "$SAUCE_ACCESS_KEY" --region us-west-1 --tunnel-name "$SAUCE_TUNNEL" </dev/null > "$(Build.SourcesDirectory)/tunel.log" 2>&1 &
              for i in $(seq 1 30); do
                if curl -sf http://localhost:9000/readiness > /dev/null; then break; fi
                sleep 2
              done

              cd "$(Build.SourcesDirectory)/$(E2E_DIR)"
              pip install -r requirements.txt
              python -m playwright install chromium
              pytest -o junit_family=xunit1 --junitxml=resultados/junit-sauce.xml
            displayName: 'App + tunel Sauce Connect + E2E en navegador real de Sauce'
            env:
              SAUCE: '1'
              SAUCE_USERNAME: $(SAUCE_USERNAME)
              SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)
              SAUCE_REGION: 'us-west-1'
              SAUCE_BROWSER: 'chrome'
              SAUCE_PLATFORM: 'Windows 11'
              SAUCE_TUNNEL: 'tienda-tunnel-$(Build.BuildId)'
              BASE_URL: 'http://localhost:3000'
              BUILD_TAG: 'tienda-e2e-$(Build.BuildId)'

          - task: PublishTestResults@2
            condition: always()
            displayName: 'Publicar resultados de Sauce (JUnit)'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(E2E_DIR)/resultados/junit-sauce.xml'
              testRunTitle: 'E2E Tienda - Sauce Labs'

  # ------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy (simulado) - solo si pasaron todos los gates'
    dependsOn:
      - E2E
      - E2E_Sauce
    condition: and(succeeded('E2E'), in(dependencies.E2E_Sauce.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    jobs:
      - job: deploy
        steps:
          - script: echo "Gates en verde. Aqui iria el despliegue real (Fase 5 - ACR o App Service)."
            displayName: 'Desplegar (simulado)'
